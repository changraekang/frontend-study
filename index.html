<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가위바위보 게임</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>가위바위보 게임</h1>
        <div class="scoreBoard">
          <div class="score">
            <p>플레이어 점수: <span id="playerScore">0</span></p>
            <p>컴퓨터 점수: <span id="computerScore">0</span></p>
          </div>
        </div>
      </header>

      <main>
        <div class="gameArea">
          <div class="result">
            <h2 id="gameResult">게임을 시작해주세요!</h2>
          </div>
          <div class="hands">
            <div class="playerHand">
              <h3>플레이어</h3>
              <div id="playerHand" class="hand">✊</div>
            </div>
            <div class="vs">VS</div>
            <div class="computerHand">
              <h3>컴퓨터</h3>
              <div id="computerHand" class="hand">✊</div>
            </div>
          </div>
          <div class="controls">
            <button id="rockBtn" class="gameBtn">✊ 바위</button>
            <button id="paperBtn" class="gameBtn">✋ 보</button>
            <button id="scissorsBtn" class="gameBtn">✌️ 가위</button>
          </div>
        </div>

        <div class="gameHistoryWrapper">
          <h3>게임 기록</h3>
          <ul id="gameHistory"></ul>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
